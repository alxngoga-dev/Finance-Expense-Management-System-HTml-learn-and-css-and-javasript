<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - Finance Manager</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>Finance<span>Manager</span></h2>
        </div>

        <nav class="sidebar-nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="add-transaction.html" class="active">
                Add Transaction
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

    </aside>


    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main class="main-content">

        <!-- Header -->

        <header class="page-header">

            <div>
                <h1>Add Transaction</h1>

                <p>
                    Record your income or expense.
                </p>
            </div>

        </header>


        <!-- ========================================
             FORM CARD
        ========================================= -->

        <section class="content-card">

            <form id="transactionForm">

                <!-- Transaction Type -->

                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type" required>

                        <option value="">
                            Select type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Example: Monthly salary"
                        required
                    >

                </div>


                <!-- Amount -->

                <div class="form-group">

                    <label for="amount">
                        Amount (RWF)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Example: 500000"
                        min="1"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Rent">
                            Rent
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <a
                        href="../index.html"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Transaction
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- Shared JavaScript -->

    <script src="../js/app.js"></script>

    <!-- Page JavaScript -->

    <script src="../js/add-transaction.js"></script>

</body>

</html>
