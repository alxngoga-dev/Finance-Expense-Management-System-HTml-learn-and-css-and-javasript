<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Categories - Finance Manager</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>Finance<span>Manager</span></h2>
        </div>

        <nav class="sidebar-nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="add-transaction.html">
                Add Transaction
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="categories.html" class="active">
                Categories
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

    </aside>


    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main class="main-content">

        <!-- Header -->

        <header class="page-header">

            <div>

                <h1>Categories</h1>

                <p>
                    Organize and manage your transaction categories.
                </p>

            </div>

        </header>


        <!-- ========================================
             ADD CATEGORY
        ========================================= -->

        <section class="content-card">

            <div class="section-header">

                <div>

                    <h2>Add Category</h2>

                    <p>
                        Create a category for your transactions.
                    </p>

                </div>

            </div>


            <form id="categoryForm">

                <div class="category-form">

                    <div class="form-group">

                        <label for="categoryName">
                            Category Name
                        </label>

                        <input
                            type="text"
                            id="categoryName"
                            placeholder="Example: Gym"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary category-submit"
                    >
                        Add Category
                    </button>

                </div>

            </form>

        </section>


        <!-- ========================================
             CATEGORY LIST
        ========================================= -->

        <section class="content-card">

            <div class="section-header">

                <div>

                    <h2>Your Categories</h2>

                    <p id="categoryCount">
                        0 categories
                    </p>

                </div>

            </div>


            <div
                id="categoriesList"
                class="categories-grid"
            >

                <!-- JavaScript inserts categories -->

            </div>

        </section>

    </main>


    <!-- Shared JavaScript -->

    <script src="../js/app.js"></script>

    <!-- Categories JavaScript -->

    <script src="../js/categories.js"></script>

</body>

</html>
