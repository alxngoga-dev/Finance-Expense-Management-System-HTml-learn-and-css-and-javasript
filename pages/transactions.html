<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions - Finance Manager</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ========================================
         SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="logo">
            <h2>Finance<span>Manager</span></h2>
        </div>

        <nav class="sidebar-nav">

            <a href="../index.html">
                Dashboard
            </a>

            <a href="transactions.html" class="active">
                Transactions
            </a>

            <a href="add-transaction.html">
                Add Transaction
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="settings.html">
                Settings
            </a>

        </nav>

    </aside>


    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main class="main-content">

        <!-- Header -->

        <header class="page-header">

            <div>
                <h1>Transactions</h1>

                <p>
                    View and manage all your transactions.
                </p>
            </div>

            <a
                href="add-transaction.html"
                class="btn btn-primary"
            >
                + Add Transaction
            </a>

        </header>


        <!-- ========================================
             SEARCH AND FILTER
        ========================================= -->

        <section class="content-card">

            <div class="transaction-controls">

                <!-- Search -->

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search transactions..."
                >


                <!-- Type Filter -->

                <select id="typeFilter">

                    <option value="all">
                        All Types
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>


                <!-- Category Filter -->

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Rent">
                        Rent
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Health">
                        Health
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </section>


        <!-- ========================================
             TRANSACTIONS TABLE
        ========================================= -->

        <section class="content-card">

            <div class="section-header">

                <div>
                    <h2>All Transactions</h2>

                    <p id="transactionCount">
                        0 transactions
                    </p>
                </div>

            </div>


            <!-- Desktop Table -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Description</th>

                            <th>Type</th>

                            <th>Category</th>

                            <th>Amount</th>

                            <th>Date</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="transactionsTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Shared JavaScript -->

    <script src="../js/app.js"></script>

    <!-- Page JavaScript -->

    <script src="../js/transactions.js"></script>

</body>

</html>
